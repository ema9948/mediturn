spring:
  datasource:
    url: jdbc:h2:mem:mediturn_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false   # JPA crea el schema en tests — Flyway tiene SQL específico de Postgres

  data:
    redis:
      host: localhost
      port: 6370     # puerto que no existe — usamos cache fake

  cache:
    type: none       # deshabilitamos Redis en tests

app:
  jwt:
    secret: test-secret-key-for-junit-tests-only-32chars
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000

logging:
  level:
    com.mediturn: WARN
    org.springframework.security: WARN
