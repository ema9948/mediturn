spring:
  application:
    name: mediturn

  datasource:
    url: jdbc:postgresql://localhost:5432/mediturn_db
    username: mediturn_user
    password: mediturn_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway maneja el schema, JPA solo valida
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:mediturn-dev-secret-key-change-in-production-please}
    expiration-ms: 86400000        # 24 horas
    refresh-expiration-ms: 604800000  # 7 días

logging:
  level:
    com.mediturn: DEBUG
    org.springframework.security: INFO
